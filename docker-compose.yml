version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbungle-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - redis
    env_file:
      - .env
